; build-environment-only override (registry not reachable): same libs, fetched from GitHub
[offline]
lib_deps =
lib_extra_dirs = /tmp/claude-0/-home-claude/0f1dd594-1c57-5b6a-a387-7cb89dc375c8/scratchpad/libs
platform_packages =
    toolchain-riscv32-esp @ file:///tmp/claude-0/-home-claude/0f1dd594-1c57-5b6a-a387-7cb89dc375c8/scratchpad/pkgs/toolchain-riscv32-esp
    tool-mklittlefs @ file:///tmp/claude-0/-home-claude/0f1dd594-1c57-5b6a-a387-7cb89dc375c8/scratchpad/pkgs/tool-mklittlefs

[env:esp32c3dev]
platform_packages = ${offline.platform_packages}
lib_deps = ${offline.lib_deps}
lib_extra_dirs = ${offline.lib_extra_dirs}

[env:c3test]
extends = env:esp32c3dev
build_unflags = ${env:esp32c3dev.build_unflags} -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = ${env:esp32c3dev.build_flags} -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0 -DWLED_DEBUG

[env:esp32c3_supermini]
extends = env:esp32c3dev
build_flags = ${env:esp32c3dev.build_flags} -D BTNPIN=9

[env:supermini_debug]
extends = env:esp32c3dev
build_flags = ${env:esp32c3dev.build_flags} -D BTNPIN=9 -D WLED_DEBUG

[env:led4you_c3]
extends = env:esp32c3dev
custom_usermods = audioreactive led4you_ble
build_flags = ${env:esp32c3dev.build_flags} -D LED4YOU_BLE -D WLED_DISABLE_INFRARED -D WLED_ENABLE_DMX
  ;; v85: GIFs share one decoder working area (patched AnimatedGIF), so two GIFs fit on the C3 too
  -D L4Y_GIF_SHARED_SCRATCH
  ;; v87: Bluetooth only as a peripheral with one phone at a time (no scanning, no central role): less memory
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ;; not used by LED4YOU, saves flash on the C3 (turn back on by removing a line): Alexa, Philips Hue, Loxone, MQTT
  -D WLED_DISABLE_ALEXA -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_LOXONE -D WLED_DISABLE_MQTT
  ;; v97: the program had grown past the 1.5 MB slot (the update was refused): ESP-NOW remotes and Adalight (serial) off
  -D WLED_DISABLE_ESPNOW -D WLED_DISABLE_ADALIGHT

[env:esp32dev]
platform_packages = toolchain-xtensa-esp32 @ file:///root/.platformio/packages/toolchain-xtensa-esp32
lib_deps = ${offline.lib_deps}
lib_extra_dirs = ${offline.lib_extra_dirs}

[env:led4you_esp32]
extends = env:esp32dev
custom_usermods = audioreactive led4you_ble
build_flags = ${env:esp32dev.build_flags} -D LED4YOU_BLE -D WLED_DISABLE_INFRARED -D WLED_ENABLE_DMX
  ;; standard RMT driver: the high-priority one crashed the classic ESP32 in a loop at start with Bluetooth
  -D WLED_USE_SHARED_RMT
  ;; all GIFs share one decoder working area (patched AnimatedGIF, usermods/led4you_ble/patches): two GIFs fit
  -D L4Y_GIF_SHARED_SCRATCH
  ;; v87: Bluetooth only as a peripheral with one phone at a time (no scanning, no central role): less memory
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
board_build.partitions = ${esp32.extended_partitions}   ;; 1.6 MB program, 700 KB for GIFs and settings
